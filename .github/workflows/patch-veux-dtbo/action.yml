name: 'Prepare veux DTBO'

description: 'Builds the veux overlay DTBO image without modifying the upstream pack process.'

runs:
  using: 'composite'
  steps:
    - name: Build dtbo.img from veux-overlay.dtbo
      shell: bash
      run: |
        set -euo pipefail

        KPATH="$GITHUB_WORKSPACE/device_kernel"
        IMAGE_DIR="$KPATH/out/arch/${{ env.KERNEL_ARCH }}/boot"
        DTBO="$(find "$KPATH" -type f -name 'veux-overlay.dtbo' -print -quit)"

        if [[ -z "$DTBO" ]]; then
          echo "::error::Expected veux-overlay.dtbo was not found under $KPATH"
          echo "[+] Available DTBO files:"
          find "$KPATH" -type f -name '*.dtbo' -print | sort || true
          exit 1
        fi

        mkdir -p "$IMAGE_DIR"

        if command -v mkdtboimg >/dev/null 2>&1; then
          MKDTBOIMG=(mkdtboimg)
        else
          echo "[+] mkdtboimg is not installed; downloading the upstream helper"
          curl -fsSL 'https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT' \
            | base64 -d > /tmp/mkdtboimg.py
          chmod +x /tmp/mkdtboimg.py
          MKDTBOIMG=(python3 /tmp/mkdtboimg.py)
        fi

        "${MKDTBOIMG[@]}" create "$IMAGE_DIR/dtbo.img" "$DTBO"
        echo "[+] Generated $IMAGE_DIR/dtbo.img from $DTBO"
