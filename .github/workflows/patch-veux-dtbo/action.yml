name: 'Package DTBO for Xiaomi veux.'

description: 'Generate dtbo.img from veux-overlay.dtbo without modifying the upstream build/pack actions.'

runs:
  using: 'composite'
  steps:
    - name: Generate veux dtbo.img
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_OUT="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"
        DTBO_SOURCE="$KERNEL_OUT/dts/vendor/xiaomi/veux-overlay.dtbo"
        DTBO_IMAGE="$KERNEL_OUT/dtbo.img"

        if [[ ! -f "$DTBO_SOURCE" ]]; then
          echo "[-] veux-overlay.dtbo not found: $DTBO_SOURCE"
          echo "[i] Available DTBO files:"
          find "$KERNEL_OUT/dts" -type f -name '*.dtbo' -print 2>/dev/null || true
          exit 1
        fi

        if command -v mkdtboimg >/dev/null 2>&1; then
          MKDTBOIMG="$(command -v mkdtboimg)"
        else
          echo "[+] mkdtboimg not found; downloading Android libufdt tool..."
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          curl -fsSL 'https://android.googlesource.com/platform/system/libufdt/+archive/master/utils.tar.gz' \
            -o "$TMP_DIR/utils.tar.gz"
          tar -xzf "$TMP_DIR/utils.tar.gz" -C "$TMP_DIR"
          MKDTBOIMG="$TMP_DIR/src/mkdtboimg.py"
          chmod +x "$MKDTBOIMG"
        fi

        echo "[+] Creating dtbo.img from veux-overlay.dtbo"
        python3 "$MKDTBOIMG" create "$DTBO_IMAGE" "$DTBO_SOURCE"

        test -s "$DTBO_IMAGE"
        echo "[+] Generated: $DTBO_IMAGE"
